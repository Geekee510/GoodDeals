<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- 关键：不发送 referer，绕过图片 CDN（y.zdmimg.com/qny.smzdm.com）的防盗链拦截，否则 GitHub Pages 上图片显示 567 拒绝 -->
  <meta name="referrer" content="no-referrer" />
  <!-- 微信内置浏览器(X5/XWeb)缓存极顽固，显式声明禁缓存（部分内核仍无视，配合下方时间戳参数双保险） -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>好价精选</title>
  <meta name="description" content="国内优惠信息聚合 · 给朋友的小圈子。数据来源：什么值得买等公开 RSS。" />
  <script>
    /* 微信 webview 不刷新的解法：CSS/JS 链接带时间戳参数，强制每次页面加载都拉最新版本 */
    document.write('<link rel="stylesheet" href="./assets/css/style.css?v=' + Date.now() + '" />');
  </script>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <div class="title-row">
        <h1 id="siteTitle">好价精选</h1>
        <button id="themeToggle" class="theme-btn" aria-label="切换深色/浅色">🌗</button>
      </div>
      <p id="siteSubtitle" class="subtitle"></p>
      <div class="controls">
        <input id="search" class="search" type="search" placeholder="搜索关键词，如 键盘 / 京东 / 茅台" />
        <div id="catFilter" class="cat-filter"></div>
      </div>
      <p id="updated" class="updated"></p>
    </div>
  </header>

  <main class="wrap">
    <div id="list" class="deal-list"></div>
    <p id="empty" class="empty" hidden>没有匹配的优惠，换个关键词或分类试试～</p>
    <p id="loaderr" class="empty" hidden>数据加载失败，请稍后刷新，或确认站点已通过 GitHub Actions 生成数据。</p>
  </main>

  <footer class="site-footer wrap">
    <p>数据来自什么值得买等平台的公开 RSS 订阅，仅供学习研究与小圈子分享，版权归原平台所有。</p>
    <p>价格与优惠以来源页面实时为准，点击卡片跳转原文查看详情。</p>
  </footer>

  <script>
    document.write('<script src="./assets/js/app.js?v=' + Date.now() + '"><\/script>');
  </script>
</body>
</html>
